name: daily-shorts
on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 3 * * *"
    - cron: "0 5 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "تجربة بدون رفع على يوتيوب (فيديو واحد)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: shorts
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
      - run: pip install -r requirements.txt

      - name: تجربة (فيديو واحد بدون رفع)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: python main.py --count 1 --no-upload
      - name: حمّل فيديو التجربة
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: output/*.mp4

      - name: التشغيل الحقيقي (يكمّل الناقص ليوم بكرة)
        if: ${{ github.event_name == 'schedule' || !inputs.test }}
        run: python main.py --count 5
      - name: save state
        if: ${{ always() && (github.event_name == 'schedule' || !inputs.test) }}
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
